name: xhop-docker
x-service: &svc
  build: .
  restart: "no"
  networks: [mesh]
  env_file: [exp.env]          # experiment overrides (MSG_COST, W_RATE, ...) written by sweep.sh; empty = defaults
  environment: &env
    TOPO: ${TOPO:-deep}
    MODE: ${MODE:-variable}
    SEED: ${SEED:-0}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 2s
    timeout: 2s
    retries: 20
services:
  service-a:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: A
    profiles: [deep, hub, chain, shallow, fanout, diamond, long]
  service-b:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: B
    profiles: [deep, chain, shallow, fanout, diamond, long]
  service-c:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: C
    profiles: [deep, chain, shallow, fanout, diamond, long]
  service-d:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: D
    profiles: [deep, chain, fanout, diamond, long]
  service-e:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: E
    profiles: [deep, chain, fanout, long]
  service-f:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: F
    profiles: [deep, chain, fanout, long]
  service-g:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: G
    profiles: [deep, long]
  service-h:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: H
    profiles: [deep, long]
  service-b1:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: B1
    profiles: [hub]
  service-b2:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: B2
    profiles: [hub]
  service-b3:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: B3
    profiles: [hub]
  service-b4:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: B4
    profiles: [hub]
  service-k:
    <<: *svc
    environment:
      <<: *env
      SERVICE_NAME: K
    profiles: [hub]
  record:                      # one recorded experiment: docker compose --profile exp run --rm record
    build: .
    command: ["python", "record.py"]
    profiles: [exp]
    networks: [mesh]
    env_file: [exp.env]
    environment:
      TOPO: ${TOPO:-deep}
      MODE: ${MODE:-variable}
      SEED: ${SEED:-0}
      OUT: /results
    volumes:
      - ./results:/results
  dashboard:
    build: .
    command: ["python", "dashboard.py"]
    ports: ["8088:8080"]
    networks: [mesh]
    environment:
      TOPO: ${TOPO:-deep}
    profiles: [live]
  loadgen:
    build: .
    command: ["python", "loadgen.py"]
    profiles: [load, live]
    networks: [mesh]
    environment:
      TOPO: ${TOPO:-deep}
      T: ${T:-45}
      SEED: ${SEED:-0}
      SLO: ${SLO:-0.5}
      OUT: /results
      BASE_RPS: ${BASE_RPS:-20}
      SPIKE_RPS: ${SPIKE_RPS:-120}
      PHASE_SECONDS: ${PHASE_SECONDS:-15}
    volumes:
      - ./results:/results
networks:
  mesh:
    driver: bridge
